name: agentdeck
description: Encrypted live coding-agent companion.
publish_to: none
version: 0.4.14+5031
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  mobile_scanner: ^7.1.3
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  record: ^6.2.1
  file_picker: ^11.0.3
  image_picker: ^1.2.3
  sherpa_onnx: ^1.13.8
  video_player: ^2.11.1
  archive: ^4.3.0
  xml: ^6.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  video_player_platform_interface: ^6.7.0
flutter:
