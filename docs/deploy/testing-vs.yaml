apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: agentdeck-testing
  namespace: ai-social
spec:
  hosts: [web-test-omnivibe.ttyuyin.com]
  gateways: [istio-ingress/unified-external]
  http:
    - name: agentdeck
      match:
        - uri:
            prefix: /agentdeck/
      # Omit timeout: Istio disables the route timeout by default. This cluster's
      # CRD rejects an explicit 0s even though long-lived WebSockets need no limit.
      route:
        - destination:
            host: agent-desk.ai-social.svc.cluster.local
            port:
              number: 8080
